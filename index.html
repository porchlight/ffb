<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Football Cheat Sheet Creator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container-fluid">
        <header class="my-4">
            <h1 class="text-center">Fantasy Football Cheat Sheet Creator</h1>
            <p class="text-center">Drag and drop players to create your own personalized cheat sheet</p>
        </header>

        <div class="row">
            <div class="col-12">
                <ul class="nav nav-tabs" id="positionTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="overall-tab" data-bs-toggle="tab" data-bs-target="#overall" type="button" role="tab" aria-controls="overall" aria-selected="true">Overall</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="qb-tab" data-bs-toggle="tab" data-bs-target="#qb" type="button" role="tab" aria-controls="qb" aria-selected="false">Quarterbacks</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="rb-tab" data-bs-toggle="tab" data-bs-target="#rb" type="button" role="tab" aria-controls="rb" aria-selected="false">Running Backs</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="wr-tab" data-bs-toggle="tab" data-bs-target="#wr" type="button" role="tab" aria-controls="wr" aria-selected="false">Wide Receivers</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="te-tab" data-bs-toggle="tab" data-bs-target="#te" type="button" role="tab" aria-controls="te" aria-selected="false">Tight Ends</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="k-tab" data-bs-toggle="tab" data-bs-target="#k" type="button" role="tab" aria-controls="k" aria-selected="false">Kickers</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="dst-tab" data-bs-toggle="tab" data-bs-target="#dst" type="button" role="tab" aria-controls="dst" aria-selected="false">Defense/ST</button>
                    </li>
                </ul>
                <div class="tab-content" id="positionTabContent">
                    <div class="tab-pane fade show active" id="overall" role="tabpanel" aria-labelledby="overall-tab">
                        <div class="player-container" id="overall-players"></div>
                    </div>
                    <div class="tab-pane fade" id="qb" role="tabpanel" aria-labelledby="qb-tab">
                        <div class="player-container" id="qb-players"></div>
                    </div>
                    <div class="tab-pane fade" id="rb" role="tabpanel" aria-labelledby="rb-tab">
                        <div class="player-container" id="rb-players"></div>
                    </div>
                    <div class="tab-pane fade" id="wr" role="tabpanel" aria-labelledby="wr-tab">
                        <div class="player-container" id="wr-players"></div>
                    </div>
                    <div class="tab-pane fade" id="te" role="tabpanel" aria-labelledby="te-tab">
                        <div class="player-container" id="te-players"></div>
                    </div>
                    <div class="tab-pane fade" id="k" role="tabpanel" aria-labelledby="k-tab">
                        <div class="player-container" id="k-players"></div>
                    </div>
                    <div class="tab-pane fade" id="dst" role="tabpanel" aria-labelledby="dst-tab">
                        <div class="player-container" id="dst-players"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4 mb-5">
            <div class="col-12 text-center">
                <button id="export-csv" class="btn btn-primary">Export to CSV</button>
                <button id="reset-rankings" class="btn btn-secondary ms-2">Reset Rankings</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="js/players-parser.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
